org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false
android.useAndroidX=false
# GameGuardian reads its native binaries from res/raw/ydw* by name and the
# repack code moves the manifest entries "res/raw/ydw3a" / "res/raw/ydw3x"
# to the lib/... names.  AGP 8 shortens the resource paths inside the APK
# (res/raw/ydw3a -> res/A6), which breaks that lookup, so the optimisation
# stays off.
android.enableResourceOptimizations=false
